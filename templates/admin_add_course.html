{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">

    <div class="dashboard-header">
        <h1>Add New Course</h1>
        <p>Enter the details of the course you want to add.</p>
    </div>

    <div class="dashboard-section">

        <form method="POST" action="{{ url_for('admin_add_course') }}">

            <div class="form-group">
                <label for="course_name">Course Name *</label>
                <input
                    type="text"
                    id="course_name"
                    name="course_name"
                    placeholder="Enter course name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Course Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Describe the course"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input
                    type="text"
                    id="category"
                    name="category"
                    placeholder="e.g. Programming, Data Science"
                >
            </div>

            <div class="form-group">
                <label for="difficulty">Difficulty Level</label>
                <select id="difficulty" name="difficulty">
                    <option value="">Select difficulty</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration_hours">Duration (Hours) *</label>
                <input
                    type="number"
                    id="duration_hours"
                    name="duration_hours"
                    min="0"
                    step="0.5"
                    placeholder="e.g. 10"
                    required
                >
            </div>

            <div class="form-group">
                <label for="instructor_id">Assign Mentor</label>
                <select id="instructor_id" name="instructor_id">
                    <option value="">No mentor assigned</option>

                    {% for mentor in mentors %}
                    <option value="{{ mentor.instructor_id }}">
                        {{ mentor.name }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <button type="submit" class="auth-button">
                Add Course
            </button>

        </form>

        <div class="admin-back-dashboard admin-course-navigation">

            <a href="{{ url_for('admin_courses') }}" class="admin-back-button">
                ← Back to Course List
            </a>

            <a href="{{ url_for('admin_dashboard') }}" class="admin-back-button">
                ← Back to Admin Dashboard
            </a>

        </div>

    </div>

</div>
{% endblock %}
